<!-- action.component.html (example template) -->
 <app-image-upload></app-image-upload>
<section class="dashboard">
    <section class="inner-content">
        <div class="welcome-container shape-container">
            <div class="box">
                <span class="border"></span>
                <h1>Act for
                    <br>
                    <span>a positif</span>
                    impact
                    <br>
                </h1>
            </div>
        </div>
        <div class="flex">
            <div class="result">
                <h4 id="h4">Résultats</h4>
                <app-result></app-result>
            </div>
        </div>
    </section>
    <section class="side">
        <div class="side-content">
            <h1>Calendrier</h1>
        </div>
        <div class="cal">
            <app-schedule></app-schedule>
        </div>

        <h1>Notifications</h1>
        <div *ngIf="reminders.length > 0">
            <div class="card marge">
                <div *ngFor="let reminder of reminders" class="card-body">
                    <div class="flex">
                        <div class="icon">
                            <img src='./assets/img/reminder.gif' alt="">
                        </div>
                        <div class="reminder-details flex">
                            <span class="feature-name up">{{ getResultName(reminder.result_id) }}-{{ reminder.name
                                }}</span>
                            <span class="reminder-time">date: {{ reminder.dueDate }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div *ngIf="reminders.length === 0">
            <p>Il n'y a pas de notifications</p>
        </div>
    </section>
</section>
