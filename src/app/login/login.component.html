<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.13.0/css/all.css">
<body>
  <div class="form-container mat-elevation-z5">
    <h1>Connexion</h1>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <mat-form-field class="example-full-width">
        <mat-label>Adresse e-mail</mat-label>
        <input matInput placeholder="Ex. Aya@gmail.com" formControlName="email" />
        <div class="input-icon">
          <i class="fa fa-envelope"></i>
        </div>
        <mat-error *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)">
          Veuillez entrer une adresse e-mail valide.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Mot de passe</mat-label>
     
          <input matInput  type="password" placeholder="******" formControlName="password" />
          <div class="input-icon">
            <i class="fa fa-key"></i>

        </div>
       
        <mat-error *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
          Le mot de passe doit contenir au moins 6 caractères.
        </mat-error>
      </mat-form-field>

      <div class="center margin-top">
        <button type="submit" mat-raised-button color="primary">Se connecter</button>
      </div>

    </form>
    <span class="center margin-top">
    Nouvel utilisateur ? 
      <a class="sign-up-link" routerLink="/sign-up">Créez un compte !</a>
    </span>
  </div>

  <img src="./assets/img/login.svg" alt="attribution illustration" class="h-48 w-48 sm:w-64 sm:h-64 lg:mr-6 lg:ml-8">
</body>
