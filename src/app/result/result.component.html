<!-- Affichage conditionnel basé sur la valeur de isAdminView -->
<!-- <ng-container *ngIf="!isAdminView"> -->
<ng-container> 
  <!-- <app-nav-bar-admin></app-nav-bar-admin> -->
  
  <section class="inner-content">
    <div class="header">
      <div class="titles">
        <button mat-raised-button color="primary" (click)="toggleForm()">Ajouter</button>
      </div>
    </div>
  </section>
</ng-container>

<section class="inner-content">
  <div class="tab">
    <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
      <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase" id="headTab">
          <tr>
            <th scope="col" class="px-6 py-3">N°</th>
            <th scope="col" class="px-6 py-3">Résultat</th>
            <th scope="col" class="px-6 py-3">Actions</th>
          </tr>
        </thead>
        <h2 *ngIf="!isResultLoaded">Loading.................</h2>
        <tbody>
          <tr *ngFor="let resultItem of ResultArray">
            <td class="px-6 py-4">{{resultItem.id}}</td>
            <td class="px-6 py-4 up" >{{resultItem.name}}</td>
            <td class="px-6 py-4 text-left" id="SR">
              <button class="edit-btn" (click)="setUpdate(resultItem)">
                <i class="fas fa-pen-square"></i>
              </button>
              <button class="delete-btn" (click)="setDelete(resultItem)">
                <i class="fas fa-trash-alt"></i>
              </button>
              <a [routerLink]="['/showRes', resultItem.id]">
                <button class="eye-btn">
                  <i class="fas fa-eye"></i>
                </button>
              </a>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>
</section>

<div class="backdrop" [ngClass]="{'popup': showForm}" (click)="toggleForm()" *ngIf="showForm">
  <div class="containerForm" [ngClass]="{'popup': showForm}">
    <form [formGroup]="resultForm" (ngSubmit)="onSubmit()" class="item" (click)="$event.stopPropagation()">
      <mat-form-field>
        <mat-label for="result">Résultat</mat-label>
        <input matInput type="text" formControlName="result" id="result" name="result">
        <mat-error *ngIf="resultForm.get('result')?.invalid && resultForm.get('result')?.touched">
          Le résultat doit commencer par 'r' suivi de chiffres.
        </mat-error>
      </mat-form-field>
      <mat-dialog-actions>
        <div class="SR item">
          <button type="submit" class="submit" mat-raised-button color="primary" [disabled]="resultForm.invalid">Sauvegarder</button>
          <button type="button" class="reset" mat-raised-button color="primary" (click)="onReset()">Réinitialiser</button>
          <button type="button" class="reset" mat-raised-button color="primary" (click)="toggleForm()">Annuler</button>
        </div>
      </mat-dialog-actions>
    </form>
  </div>
</div>
