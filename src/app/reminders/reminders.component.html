    <h4>Notifications</h4>
    <div *ngIf="reminders.length > 0" class="card">
         <div *ngFor="let reminder of reminders" class="card-body"  >
             <div class="flex" >
                 <div class="icon">
                     <img src='./assets/img/reminder.gif' alt="">
                 </div>
 
                 <div class="reminder-details flex">
                     <span class="feature-name">{{ reminder.name }}</span>
                     <span class="reminder-time">date: {{ reminder.dueDate }}</span>
                 </div>
             </div>
         </div>
 </div>
 <div *ngIf="reminders.length === 0">
